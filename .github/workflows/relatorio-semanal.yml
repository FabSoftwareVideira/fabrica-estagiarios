name: Relatório semanal dos supervisores

on:
  schedule:
    # Verifica a configuração do administrador; o script respeita o horário de Brasília.
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enviar-relatorios:
    runs-on: self-hosted
    concurrency:
      group: relatorio-semanal-supervisores
      cancel-in-progress: false
    steps:
      - name: Verificar programação e enviar se estiver no horário
        run: docker exec fabrica-estagiarios-web node src/scripts/enviarRelatorioSemanalSupervisores.js
